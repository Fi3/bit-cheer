name: CI

# The full quality gate. It runs on every pull request, and the Pages deployment
# runs it again (workflow_call) before it publishes main, so only checked code ships.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache Elm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('elm.json', 'review/elm.json') }}
      - name: Install locked npm dependencies, including Elm
        run: npm ci
      - name: Lint Rust (rustfmt, clippy), Elm (elm-format, elm-review) and JavaScript (Prettier, ESLint)
        run: npm run lint
      - name: Unit tests (rhythm model, Rust engine, compiled WASM, JavaScript, docs)
        run: npm test

  e2e:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache Elm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('elm.json', 'review/elm.json') }}
      - name: Install locked npm dependencies, including Elm
        run: npm ci
      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium
      - name: Play the app in a real browser
        run: npm run test:e2e
      - name: Keep screenshots and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
